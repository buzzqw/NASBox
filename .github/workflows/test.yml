name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: client-go/go.mod
          cache-dependency-path: client-go/go.sum
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev inotify-tools
      - name: Vet and test (includes end-to-end)
        working-directory: client-go
        run: go vet ./... && go test ./...

  server-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Test the shell-script daemon (pytest)
        run: python -m pytest -q
      - run: bash -n server/install.sh server/sync-daemon-server.sh server/uninstall.sh
