name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Qt runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Test client e server (pytest)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - run: PYTHONPATH=client python tools/nasbox_load_test.py --files 10 --size 128 --metrics-samples 1
      - run: bash -n server/install.sh server/sync-daemon-server.sh server/uninstall.sh client/install.sh
