name: Package NASBox

# Il client Go e' quello ufficiale: ogni tag vX.Y.Z produce e allega il suo
# binario e il pacchetto Debian. I vecchi artifact Python restano disponibili
# solo su richiesta (workflow_dispatch), non fanno piu parte delle release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: client-go/go.mod
          cache-dependency-path: client-go/go.sum
      - name: Check release version
        id: version
        run: |
          expected="$(packaging/version-go.sh)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$expected" ]]; then
              echo "tag $version non corrisponde alla versione Go $expected" >&2
              exit 1
            fi
          else
            version="$expected"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev inotify-tools
      - name: Vet and test (includes end-to-end)
        working-directory: client-go
        run: go vet ./... && go test ./...
      - name: Build Go client
        working-directory: client-go
        run: go build -trimpath -ldflags='-s -w' -o "../dist/nasbox-go-${{ steps.version.outputs.version }}" ./cmd/nasbox
      - name: Build Debian package
        run: packaging/build-deb-go.sh "dist/nasbox-go-${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: nasbox-go
          path: |
            dist/nasbox-go-*
            dist/nasbox-go_*.deb
          if-no-files-found: error

  windows:
    # SPERIMENTALE: compila il client per Windows (Fyne richiede CGO: il runner
    # Windows ha gia' MinGW). Non e' stato ancora provato su un PC Windows e un
    # suo fallimento non blocca la release Linux.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: client-go/go.mod
          cache-dependency-path: client-go/go.sum
      - name: Vet (compilazione di tutto per Windows)
        shell: bash
        working-directory: client-go
        run: go vet ./...
      - name: Test dei pacchetti portabili
        shell: bash
        working-directory: client-go
        run: go test ./internal/filelock ./internal/osx
      - name: Build Windows client
        shell: bash
        working-directory: client-go
        run: |
          version="$(../packaging/version-go.sh)"
          mkdir -p ../dist
          go build -trimpath -ldflags='-s -w -H=windowsgui' -o "../dist/nasbox-go-${version}-windows-amd64-sperimentale.exe" ./cmd/nasbox
      - uses: actions/upload-artifact@v4
        with:
          name: nasbox-go-windows
          path: dist/nasbox-go-*-windows-*.exe
          if-no-files-found: error

  python-legacy:
    # Solo ricostruzione manuale del vecchio client: non viene piu pubblicato.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: Download appimagetool
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum --check
          chmod +x "$RUNNER_TEMP/appimagetool"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/appimage-runtime" \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $RUNNER_TEMP/appimage-runtime" | sha256sum --check
      - name: Build legacy artifacts
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          APPIMAGE_RUNTIME_FILE: ${{ runner.temp }}/appimage-runtime
        run: |
          packaging/build-appimage.sh
          packaging/build-deb.sh
          packaging/build-client-update.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nasbox-python-legacy
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/nasbox-client-update-*.tar.gz
            dist/nasbox-client-update-*.tar.gz.sha256
          if-no-files-found: error

  release:
    # Parte sempre che il job Linux riesca, anche se la build Windows (sperimentale)
    # fallisce o viene saltata.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.go.result == 'success' }}
    needs: [go, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: nasbox-go*
          merge-multiple: true
          path: dist
      - name: Prepare release notes
        run: |
          python3 packaging/changelog_section.py "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/release-notes.md
