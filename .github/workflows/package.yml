name: Package NASBox

# Every tag vX.Y.Z builds and attaches the desktop client, the Debian package,
# the NAS daemon (arm64 and amd64) and, as an experimental extra, a Windows build.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: client-go/go.mod
          cache-dependency-path: client-go/go.sum
      - name: Check release version
        id: version
        run: |
          expected="$(packaging/version-go.sh)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$expected" ]]; then
              echo "tag $version non corrisponde alla versione Go $expected" >&2
              exit 1
            fi
          else
            version="$expected"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev inotify-tools
      - name: Vet and test (includes end-to-end)
        working-directory: client-go
        run: go vet ./... && go test ./...
      - name: Build Go client
        working-directory: client-go
        run: go build -trimpath -ldflags='-s -w' -o "../dist/nasbox-go-${{ steps.version.outputs.version }}" ./cmd/nasbox
      - name: Build NAS daemon (arm64 and amd64)
        working-directory: client-go
        run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags='-s -w' \
              -o "../dist/nasbox-server-linux-$arch" ./cmd/nasbox-server
          done
          cp ../server/server.conf.example ../dist/server.conf.example
      - name: Build Debian package
        run: packaging/build-deb-go.sh "dist/nasbox-go-${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: nasbox-go
          path: |
            dist/nasbox-go-*
            dist/nasbox-go_*.deb
            dist/nasbox-server-linux-*
            dist/server.conf.example
          if-no-files-found: error

  windows:
    # SPERIMENTALE: compila il client per Windows (Fyne richiede CGO: il runner
    # Windows ha gia' MinGW). Non e' stato ancora provato su un PC Windows e un
    # suo fallimento non blocca la release Linux.
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: client-go/go.mod
          cache-dependency-path: client-go/go.sum
      - name: Compila il client per Windows
        # Solo il client: il demone del NAS (serverd) e i test con chiamate Unix
        # non girano su Windows e non fanno parte di questa verifica.
        shell: bash
        working-directory: client-go
        run: go build ./cmd/nasbox
      - name: Test dei pacchetti portabili
        shell: bash
        working-directory: client-go
        run: go test ./internal/filelock ./internal/osx
      - name: Build Windows client
        shell: bash
        working-directory: client-go
        run: |
          version="$(../packaging/version-go.sh)"
          mkdir -p ../dist
          go build -trimpath -ldflags='-s -w -H=windowsgui' -o "../dist/nasbox-go-${version}-windows-amd64-sperimentale.exe" ./cmd/nasbox
      - uses: actions/upload-artifact@v4
        with:
          name: nasbox-go-windows
          path: dist/nasbox-go-*-windows-*.exe
          if-no-files-found: error

  release:
    # Parte sempre che il job Linux riesca, anche se la build Windows (sperimentale)
    # fallisce o viene saltata.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.go.result == 'success' }}
    needs: [go, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: nasbox-go*
          merge-multiple: true
          path: dist
      - name: Prepare release notes
        run: |
          python3 packaging/changelog_section.py "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/release-notes.md
